<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #ffffff;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 50px 0 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #1a6bc4;
            color: #0d4a8a;
            position: relative;
        }
        .section-title i {
            margin-right: 12px;
            color: #1a6bc4;
        }
        .photo-section {
            margin-bottom: 40px;
        }
        .photo-caption-top {
            text-align: center;
            margin: 0 auto 25px;
            color: #555;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 8px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            display: inline-block;
            background-color: #f9f9f9;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .photo-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .photo-item {
            flex: 0 0 calc(50% - 20px); /* 每行两张，考虑间隙 */
            min-width: 280px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            background: white;
            position: relative;
            height: 300px; /* 设置一个统一的基础高度或最小高度 */
            display: flex;
            align-items: center; /* 垂直居中 */
            justify-content: center; /* 水平居中 */
        }
        .photo-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }
        .photo-item img {
            width: auto; /* 改为自动宽度以适应容器 */
            max-width: 100%; /* 确保图片不超出容器 */
            height: auto; /* 保持原始宽高比 */
            max-height: 100%; /* 限制最大高度为容器高度 */
            display: block;
            transition: transform 0.5s ease;
            object-fit: contain; /* 包含整个图片，保持比例 */
        }
        .photo-item:hover img {
            transform: scale(1.05);
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 25px 0;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #e0e0e0;
        }
        @media (max-width: 992px) {
            .photo-item {
                flex: 0 0 calc(50% - 20px); /* 平板端每行两张 */
            }
        }
        @media (max-width: 600px) {
            .photo-item {
                flex: 0 0 100%; /* 手机端每行一张 */
            }
            .section-title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
