<style>
    .photo-section {
        margin-bottom: 30px;
    }
    .photo-row {
        display: flex;
        flex-wrap: wrap;
        gap: 2%; /* 用gap替代margin控制间距 */
        margin-bottom: 20px;
    }
    .photo-item {
        /* 基础宽度计算：(100% - 2 * 2%)/3 = 32% */
        width: calc(96%/3); /* 更精确的计算方式 */
        margin-bottom: 15px;
        transition: transform 0.3s;
        border-radius: 8px;
        overflow: hidden;
    }
    /* 当只有2个item时的特殊处理 */
    .photo-row:has(.photo-item:nth-last-child(2)) .photo-item {
        width: 49%; /* (100% - 2%)/2 */
    }
    /* 当只有1个item时的特殊处理 */
    .photo-row:has(.photo-item:only-child) .photo-item {
        width: 100%;
    }
    .photo-item:hover {
        transform: scale(1.05);
    }
    .photo-item img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
    }
    @media (max-width: 992px) {
        .photo-item {
            width: 48%; /* 平板端每行2张 */
        }
        /* 覆盖特殊情况的处理 */
        .photo-row:has(.photo-item:nth-last-child(2)) .photo-item,
        .photo-row:has(.photo-item:only-child) .photo-item {
            width: 48%;
        }
    }
    @media (max-width: 600px) {
        .photo-item {
            width: 100%; /* 手机端每行1张 */
        }
        /* 覆盖特殊情况的处理 */
        .photo-row:has(.photo-item:nth-last-child(2)) .photo-item,
        .photo-row:has(.photo-item:only-child) .photo-item {
            width: 100%;
        }
    }
</style>
